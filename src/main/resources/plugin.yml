name: 'PepeForge'
version: '${project.version}'
main: pepin.pepeforge.PepeForgePlugin
api-version: '1.21'
folia-supported: true
authors:
  - Pepin
description: Adds custom weapons, tools and gameplay mechanics to Minecraft servers.

commands:
  pepeforge:
    description: Manages custom PepeForge items and plugin settings.
    usage: /pepeforge <give|items|setlevel|migration|config|reload>
    aliases: [pf]

permissions:
  pepeforge.give:
    description: Allows giving custom PepeForge items.
    default: op
  pepeforge.items:
    description: Allows opening the custom PepeForge items menu.
    default: op
  pepeforge.setlevel:
    description: Allows setting the level of a held Crimson Sword.
    default: op
  pepeforge.migration:
    description: Allows managing lazy custom-item migration.
    default: op
  pepeforge.config:
    description: Allows opening the PepeForge configuration menu.
    default: op
  pepeforge.reload:
    description: Allows reloading PepeForge configuration and modules.
    default: op
