name: 'PepeForge'
version: '${project.version}'
main: pepin.pepeforge.PepeForgePlugin
api-version: '1.21'
folia-supported: true
authors:
  - Pepin
description: Adds custom weapons, tools and gameplay mechanics to Minecraft servers.

commands:
  pepeforge:
    description: Gives or opens custom PepeForge items.
    usage: /pepeforge <give|items>
    aliases: [pf]

permissions:
  pepeforge.give:
    description: Allows giving custom PepeForge items.
    default: op
  pepeforge.items:
    description: Allows opening the custom PepeForge items menu.
    default: op
