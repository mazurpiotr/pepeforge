messages:
  prefix: "&6[PepeForge] "
  command:
    players_only: "&cOnly players can use this command."
    no_permission: "&cYou do not have permission to use this command."
    usage: "&eUsage: /pepeforge give <crescent_bow|crescent_spear|chisel|katana|iron_wind_blade|diamond_wind_blade|netherite_wind_blade|iron_greatsword|diamond_greatsword|netherite_greatsword|iron_scythe|diamond_scythe|netherite_scythe|crimson_sword|anchor|throwing_knife|stormcleaver|emberfang> <player> or /pepeforge items"
    unknown_subcommand: "&cUnknown subcommand."
    unknown_item: "&cUnknown item: {item}"
    item_disabled: "&cThat item is currently disabled: {item}"
    player_not_found: "&cPlayer not found: {player}"
    give_success_sender: "&aGave {item} to {player}."
    give_success_target: "&aYou received {item}&a."
    give_inventory_full: "&cCould not give {item} to {player}: their inventory is full."
    crimson_sword_only: "&cOnly Crimson Sword is supported."
    setlevel_success: "&aCrimson Sword level set to {level}."
    invalid_level: "&cInvalid level."
  menu:
    title: "&8Pepe Items"
    item_received: "&aItem added to your inventory."
  two_handed:
    offhand_required: "&cThis weapon requires an empty off-hand."
  katana:
    cooldown: "&cKatana recharging... {bar} &7{seconds}s"
  wind_blade:
    cooldown: "&cDash recharging... {bar} &7{seconds}s"
  solar_shield:
    charge: "&e☀ Solar charge {bar} &6[{charges}/3]"
    ready: "&6☀ Solar charge ready! {bar} &6[3/3]"
    discharging: "&8☽ Discharging {bar} &6[{charges}/3]"
  crescent_spear:
    charge: "&dMoon charge {bar}"
    ready: "&dMoon charge ready! &fNext strike empowered {bar}"
  greatsword:
    rhythm: "&6Rhythm {bar} &f{stage}/{max_stage}"
  anchor:
    cooldown: "&cAnchor hook recharging... {bar} &7{seconds}s"
  stormcleaver:
    charge: "&bStatic Charge {bar} &7[{charges}/{required}]"
    ready: "&bStatic Charge ready! &fRight-click to unleash {bar}"
  config:
    reloaded: "&aPepeForge reloaded successfully."
    reload_reminder: "&eConfiguration saved. Use the &6Reload Plugin &ebutton or &6/pepeforge reload &eto apply changes."
items:
  crescent_bow:
    fallback_name: "Crescent Bow"
    lore:
      - "&6---------------"
      - "&eAbility: &dCrescent Volley"
      - "&3Fires a 3-arrow crescent spread."
      - "&3Consumes one arrow per volley."
      - "&3Deals 1 less damage by day, but 2 bonus damage under moonlight."
      - "Epic"
      - "&6---------------"
  crescent_spear:
    fallback_name: "Crescent Spear"
    lore:
      - "&6---------------"
      - "&eAbility: &dMoonlit Flurry"
      - "&3Hits charge an empowered strike. A charged attack unleashes 3 rapid slashes."
      - "&3Deals 1 less damage by day, but 2 bonus damage under moonlight."
      - "Epic"
      - "&6---------------"
  chisel:
    fallback_name: "Chisel"
    lore:
      - "&6---------------"
      - "&eAbility: &bCarve"
      - "&3Right-click cycles decorative block variants."
      - "&3Sneak and right-click cycles backward."
      - "Common"
      - "&6---------------"
  katana:
    fallback_name: "Katana"
    lore:
      - "&6---------------"
      - "&eAbility: &bParry"
      - "&3Right-click to enter a brief parry stance."
      - "&3Blocks melee and reflects projectiles."
      - "&7Two-Handed"
      - "Rare"
      - "&6---------------"
  iron_wind_blade:
    fallback_name: "Iron Wind Blade"
    lore:
      - "&6---------------"
      - "&eAbility: &bSwift Strike / Wind Dash"
      - "&3Gain Speed I briefly after hitting."
      - "&3Right-click to dash forward."
      - "Common"
      - "&6---------------"
  diamond_wind_blade:
    fallback_name: "Diamond Wind Blade"
    lore:
      - "&6---------------"
      - "&eAbility: &bSwift Strike / Wind Dash"
      - "&3Gain Speed I while holding."
      - "&3Right-click to dash forward."
      - "Rare"
      - "&6---------------"
  netherite_wind_blade:
    fallback_name: "Netherite Wind Blade"
    lore:
      - "&6---------------"
      - "&eAbility: &bSwift Strike / Wind Dash"
      - "&3Gain Speed I while holding."
      - "&3Gain Speed II briefly after hitting."
      - "&3Right-click to dash forward."
      - "Epic"
      - "&6---------------"
  iron_greatsword:
    fallback_name: "Iron Greatsword"
    lore:
      - "&6---------------"
      - "&eAbility: &6Rhythm Cleave"
      - "&3Timed swings release area cuts."
      - "&3Rhythm widens the attack arc."
      - "&7Two-Handed"
      - "Common"
      - "&6---------------"
  diamond_greatsword:
    fallback_name: "Diamond Greatsword"
    lore:
      - "&6---------------"
      - "&eAbility: &6Rhythm Cleave"
      - "&3Timed swings release area cuts."
      - "&3Rhythm widens the attack arc."
      - "&7Two-Handed"
      - "Rare"
      - "&6---------------"
  netherite_greatsword:
    fallback_name: "Netherite Greatsword"
    lore:
      - "&6---------------"
      - "&eAbility: &6Rhythm Cleave"
      - "&3Timed swings release area cuts."
      - "&3Rhythm widens the attack arc."
      - "&7Two-Handed"
      - "Epic"
      - "&6---------------"
  iron_scythe:
    fallback_name: "Iron Scythe"
    lore:
      - "&6---------------"
      - "&eAbility: &aHarvest"
      - "&3Harvests ripe crops in a 3x3 area."
      - "&3Automatically replants using drops or inventory."
      - "Common"
      - "&6---------------"
  diamond_scythe:
    fallback_name: "Diamond Scythe"
    lore:
      - "&6---------------"
      - "&eAbility: &aHarvest"
      - "&3Harvests ripe crops in a 5x5 area."
      - "&3Automatically replants using drops or inventory."
      - "Rare"
      - "&6---------------"
  netherite_scythe:
    fallback_name: "Netherite Scythe"
    lore:
      - "&6---------------"
      - "&eAbility: &aHarvest"
      - "&3Harvests ripe crops in a 7x7 area."
      - "&3Automatically replants using drops or inventory."
      - "Epic"
      - "&6---------------"
  crimson_sword:
    fallback_name: "Crimson Sword"
    lore:
      - "&6---------------"
      - "&eLevel: &c{level} &7({xp}/{max_xp} XP)"
      - "&3The weapon gains XP from dealt damage."
      - "&3Dealt damage charges the Crimson Aura."
      - "&7Active traits:"
      - "{features}"
      - "Legendary"
      - "&6---------------"
    features:
      edge: "&cCrimson Edge: +{percent}% damage"
      lifesteal: "&cLifesteal: +{percent}%"
      lifesteal_next: "&cLifesteal: +{percent}% (next level: Lv {next_level}, +{next_percent}%)"
      lifesteal_locked: "&8Lifesteal: Unlocks at level 5"
      aura: "&4Crimson Aura ({seconds}s): {drain} HP/s within {radius} blocks"
      aura_next: "&4Crimson Aura ({seconds}s): {drain} HP/s within {radius} blocks (next at Lv {next_level}: {next_seconds}s, {next_drain} HP/s)"
      aura_locked: "&8Crimson Aura: Unlocks at level 10"
    dynamic_text:
      level_suffix: "[Lv. {level}]"
      max_xp: "MAX"
  solar_shield:
    fallback_name: "Solar Shield"
    lore:
      - "&6---------------"
      - "&8&oAncient Cities were not always shrouded in darkness..."
      - "&eAbility: &6Solar Retaliation"
      - "&3Charges passively in sunlight."
      - "&3Blocking consumes a charge to ignite attackers and trigger a flashbang."
      - "Legendary"
      - "&6---------------"
  anchor:
    fallback_name: "Anchor"
    lore:
      - "&6---------------"
      - "&eBasic Attack: &9Snare"
      - "&3Hits slow and immobilize targets for a short time."
      - "&eAbility: &9Anchor Throw"
      - "&3Right-click throws the anchor. A block hit"
      - "&3pulls you to it; an entity hit brings you together."
      - "Rare"
      - "&6---------------"
  throwing_knife:
    fallback_name: "Throwing Knife"
    lore:
      - "&6---------------"
      - "&eAbility: &dKnife Throw"
      - "&3Right-click to throw the knife."
      - "&3Missed knives can be picked up from the ground."
      - "Common"
      - "&6---------------"
  stormcleaver:
    fallback_name: "Stormcleaver"
    lore:
      - "&6---------------"
      - "&eAbility: &bThunder Slam"
      - "&3Melee hits gathers Charges."
      - "&3At full charge, right-click on the ground to leap skyward."
      - "&3Landing unleashes a lightning shockwave."
      - "Legendary"
      - "&6---------------"
  emberfang:
    fallback_name: "Emberfang"
    lore:
      - "&6---------------"
      - "&ePassive: &cEmber Strike"
      - "&3Trades some melee damage for {fire_damage} fire damage on hit; defenses can reduce the bonus."
      - "&3Strikes can briefly set targets ablaze."
      - "&cBurns its wielder unless they wear armor enchanted with Fire Protection."
      - "Epic"
