# Language for plugin messages (commands, menus, errors)
language: en_us

# Enable or disable sending anonymous statistics to bStats.
metrics:
  enabled: true

# Translation settings
translations:
  # This requires Paper/Folia/Purpur item text data components.
  # Use client-side item name/lore translations from the resource pack.
  # Without the resource pack, players will see raw translation keys
  # instead of localized item names and lore.
  # Spigot automatically falls back to server-side text from lang/*.yml.
  use_client_side: true
  # Server language if client-side translation is disabled or unsupported.
  server_language: "en_us"

# Item availability settings
# enabled: hard on/off switch for the item itself
# recipe_enabled: controls crafting separately and must be set explicitly
items:
  solar_shield:
    enabled: true
    recipe_enabled: true
  crescent_bow:
    enabled: true
    recipe_enabled: true
  crescent_spear:
    enabled: true
    recipe_enabled: true
  chisel:
    enabled: true
    recipe_enabled: true
  katana:
    enabled: true
    recipe_enabled: true
  iron_wind_blade:
    enabled: true
    recipe_enabled: true
  diamond_wind_blade:
    enabled: true
    recipe_enabled: true
  netherite_wind_blade:
    enabled: true
    recipe_enabled: true
  iron_greatsword:
    enabled: true
    recipe_enabled: true
  diamond_greatsword:
    enabled: true
    recipe_enabled: true
  netherite_greatsword:
    enabled: true
