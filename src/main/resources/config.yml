# Language for plugin messages (commands, menus, errors)
language: en_us

# Enable or disable sending anonymous statistics to bStats.
metrics:
  enabled: true

# Translation settings
translations:
  # This requires Paper/Folia/Purpur item text data components.
  # Use client-side item name/lore translations from the resource pack.
  # Without the resource pack, players will see raw translation keys
  # instead of localized item names and lore.
  # Spigot automatically falls back to server-side text from lang/*.yml.
  use_client_side: true
  # Server language if client-side translation is disabled or unsupported.
  server_language: "en_us"

# Resource Pack delivery.
# MANAGER: The server owner must handle Resource Pack delivery, e.g. using an external plugin.
# GITHUB: PepeForge sends the release pack from GitHub to players.
resource_pack:
  mode: MANAGER

# Shared Wind Blade family settings.
mechanics:
  rapier:
    # Final attack damage in HP (1-40) for each tier.
    damage:
      iron: 5.0
      diamond: 6.0
      netherite: 7.0
    # Attacks per second (0.5-4).
    attack_speed: 2.0
    frontal_bonus_enabled: false
    # Damage bonus (0-100%) within the frontal cone (1-180 degrees).
    frontal_bonus_percent: 20.0
    frontal_cone_degrees: 120.0
  ice_rapier:
    # Damage in HP (1-40), decreasing from maximum to minimum as the blade wears.
    min_damage: 4.0
    max_damage: 8.0
    # Custom maximum durability (1-250).
    max_durability: 32
    # Native freeze meter on Thrust and Cut hits (1-600); naturally decays, not a duration.
    freeze_ticks: 200
  wind_blade:
    dash_cooldown: 5000
    dash_strength: 1.5
    dash_while_gliding: false
  anchor:
    ability_cooldown: 5000
    snare_duration: 40
    snare_cooldown: 5000
    ability_range: 20.0
    snare_enabled: true
    hook_enabled: true
  crescent_spear:
    charges_required: 5
    active_hit_count: 2
  crescent_khopesh:
    moonstrike_mode: SWEEP
    hits_required: 3
    # Maximum temporary shield in HP; 2 HP = 1 heart. Duration is fixed at 80 ticks.
    shield_absorption: 4.0
    wave_range: 4.5
    wave_width: 2.8
    wave_speed: 0.65
    sweep_width: 3.0
    sweep_range: 2.0
  stormcleaver:
    charges_required: 5
    jump_velocity_multiplier: 1.5
    charge_decay_interval: 40
  greatsword:
    projectile_knockback_immunity: true
    micro_dash_enabled: true
    micro_dash_strength: 0.15
  emberfang:
    fire_damage: 4.0
  obsidian_glaive:
    damage: 7.0
    stab_enabled: true
    stab_lift_enabled: true

# Item availability settings
# enabled: hard on/off switch for the item itself
